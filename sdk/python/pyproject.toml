[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumora-bot"
version = "1.1.0"
description = "Lumora Bot SDK for Python: build bots for the Lumora messenger (commands, buttons, groups, files, checklists, reminders)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Lumora" }]
keywords = ["lumora", "bot", "chatbot", "messenger", "sdk", "end-to-end-encryption"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://getlumora.pages.dev/developers/"
Documentation = "https://getlumora.pages.dev/developers/reference/python/"
Changelog = "https://getlumora.pages.dev/developers/reference/#changelog"

[tool.setuptools]
py-modules = ["lumora_bot"]
license-files = ["LICENSE"]
