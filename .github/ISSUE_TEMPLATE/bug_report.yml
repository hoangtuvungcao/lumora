name: Bug report / Báo lỗi
description: Report a reproducible problem without exposing private data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Vietnamese and English are welcome. Never share passwords, recovery phrases,
        tokens, databases or unredacted logs. Use synthetic data in screenshots.
  - type: input
    id: version
    attributes:
      label: App version and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and connection type
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted error message or screenshot
      description: Optional. Remove private conversations, names, IPs and secrets first.
