[package]
name = "lumora-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lumora_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
lumora-core = { path = "../lumora-core" }
lumora-media = { path = "../lumora-media", optional = true }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
zeroize = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
media = ["lumora-core/media", "dep:lumora-media"]
