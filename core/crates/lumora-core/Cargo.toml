[package]
name = "lumora-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lumora-media = { path = "../lumora-media", optional = true }
anyhow = "1.0.104"
argon2 = "0.5"
blake3 = "1.8.7"
bytes = "1.12.1"
chacha20poly1305 = "0.10"
curve25519-dalek = "4"
data-encoding = "2.11.1"
dirs = "7.0.0"
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8", "zeroize"] }
futures = "0.3.34"
hex = "0.4.3"
if-addrs = "0.15.0"
igd-next = { version = "0.18.0", features = ["aio_tokio"] }
lru = "0.12"
mainline = "8.0.1"
parking_lot = "0.12.5"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rand = "0.8"
rcgen = "0.14.10"
rmp-serde = "1.3.1"
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl", "functions"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
secp256k1 = { version = "0.29", features = ["rand", "global-context", "rand-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.10"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
x509-parser = "0.18.1"
zeroize = "1.9.1"
# multi-device linking with a short code (PAKE: nothing checkable offline is ever published)
spake2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
vodozemac = "0.11.1"
# push wake-up (iPhone): sealing formats shared with the bridge; HTTPS POST to the bridge
lumora-push = { path = "../lumora-push", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"

# free disk space (statvfs / GetDiskFreeSpaceExW) and O_NOFOLLOW for partial downloads
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"], optional = true }

# Bonjour/DNS-SD LAN discovery (no multicast entitlement needed on Apple platforms; iOS uses
# the system Bonjour from Swift instead, see app/ios/Runner/LumoraBonjour.swift).
[target.'cfg(not(target_os = "ios"))'.dependencies]
mdns-sd = { version = "0.21", optional = true }

[features]
default = ["os-keyring", "mdns"]
mdns = ["dep:mdns-sd"]
os-keyring = ["dep:keyring"]
media = ["dep:lumora-media", "lumora-media/camera-v4l"]
# DEV/TEST ONLY: source-built OpenH264 (H.264 on Linux for tests). Never in releases.
openh264-source = ["media", "lumora-media/openh264-source"]
# Exposes a few private parsers to the fuzz harness (core/fuzz). Never enabled in builds we ship.
fuzzing = []

[dev-dependencies]
tempfile = "3"
