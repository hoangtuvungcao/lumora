[package]
name = "lumora-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lumora relay: authenticated WebSocket forwarder + signal mailbox + STUN responder (last-resort path; never decrypts)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "lumora-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "ws", "json"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
clap = { version = "4.5", features = ["derive", "env"] }
data-encoding = "2.11.1"
ed25519-dalek = "2.1"
futures = "0.3.34"
hex = "0.4.3"
parking_lot = "0.12.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4.3"
rand = "0.8"
tokio-tungstenite = "0.30.0"
