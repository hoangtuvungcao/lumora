[package]
name = "lumora-push"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional, self-hostable APNs wake-up bridge for Lumora (content-free pushes) + the sealing formats shared with lumora-core"

[lib]
name = "lumora_push"

[[bin]]
name = "lumora-push"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# The HTTP bridge (axum) + APNs HTTP/2 client. lumora-core uses only the light library.
server = [
  "dep:axum", "dep:tokio", "dep:h2", "dep:http", "dep:bytes", "dep:tokio-rustls", "dep:webpki-roots",
  "dep:ring", "dep:clap", "dep:tracing", "dep:tracing-subscriber", "dep:parking_lot",
]

[dependencies]
blake3 = "1.8.7"
chacha20poly1305 = "0.10"
data-encoding = "2.11.1"
hkdf = "0.12"
rand = "0.8"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
x25519-dalek = { version = "2", features = ["static_secrets"] }

axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"], optional = true }
bytes = { version = "1", optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
h2 = { version = "0.4", optional = true }
http = { version = "1", optional = true }
parking_lot = { version = "0.12.5", optional = true }
ring = { version = "0.17", optional = true }
tokio = { version = "1.54.1", features = ["full"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
webpki-roots = { version = "0.26", optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
